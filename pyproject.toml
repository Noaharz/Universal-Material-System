[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-material-system"
version = "2.0.0"
description = "Universal Material System (UMS) - .atom / .structure / .material formats, resource manager, materialsystem and runtime"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Universal Material System Working Group" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
ums-cli = "ums.cli:main"
material-cli = "ums.cli:main"

[tool.setuptools.packages.find]
include = ["ums*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
